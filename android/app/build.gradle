plugins { id 'com.android.application' }
android {
    namespace 'com.noros.higher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.noros.higher'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }
    signingConfigs {
        release {
            storeFile file('higher.keystore')
            storePassword 'higher-sideload'
            keyAlias 'higher'
            keyPassword 'higher-sideload'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
