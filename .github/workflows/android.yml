name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Publish to the "app" release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Higher.apk
          gh release view app >/dev/null 2>&1 || gh release create app --title "Higher (Android)" --notes "Install once. The game updates itself from GitHub Pages - you only need a new APK if this release changes."
          gh release upload app Higher.apk --clobber
